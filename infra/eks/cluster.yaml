# EKS cluster for the streaming platform.
#
#   eksctl create cluster -f infra/eks/cluster.yaml     # ~15-20 minutes
#
# This file is the source of truth for the cluster, the VPC, the node group
# and the core add-ons. eksctl keeps no state file, so anything you change in
# the console will NOT be reconciled -- make cluster-level changes here and
# apply them with eksctl, and keep everything else (add-ons via Helm,
# workloads via Kustomize) declarative in git too.
#
# Identity setup (rebuilt 2026-08-10): IAM Identity Center lives in us-east-1,
# instance ssoins-7223ef3085110868, start URL https://d-90667b4413.awsapps.com/start.
# Two permission sets exist for account 242626138899:
#   AdminAccess      (AdministratorAccess)              -> user aayush, creates this cluster
#   StreamingDeploy  (PowerUserAccess + eksctl IAM set) -> user fatima, see accessEntries
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: streaming
  region: us-east-1
  version: "1.36"
  tags:
    Project: streaming

# Pin the VPC's AZs. If omitted, eksctl picks two at random each run: our
# first run (2026-08-10) got us-east-1f/us-east-1a while the nodegroup below
# asked for us-east-1a/us-east-1b, and nodegroup creation failed with "could
# not find private subnets for zones". Pinned to what that run actually built
# so the file now describes reality AND reproduces deterministically.
availabilityZones: [us-east-1a, us-east-1f]

# Future eksctl releases turn on EKS Auto Mode by default, which stops
# creating managed nodegroups and networking add-ons from this file. Pin the
# behavior this file was written against.
autoModeConfig:
  enabled: false

# EKS Access Entries, not the legacy aws-auth ConfigMap. "API" means the
# ConfigMap is not consulted at all -- one source of truth, auditable in
# CloudTrail, and recoverable with the EKS API if it is ever wrong.
accessConfig:
  authenticationMode: API
  bootstrapClusterCreatorAdminPermissions: true
  accessEntries:
    # A second admin, so deleting the creating principal cannot lock you out.
    # The creator (aayush's AdminAccess role) gets admin automatically via
    # bootstrapClusterCreatorAdminPermissions -- do NOT also list it here or
    # eksctl fails on the duplicate. This entry is fatima's StreamingDeploy
    # role. If StreamingDeploy is the CREATOR instead (fatima deploys), swap
    # this entry to the AdminAccess role ARN (TM-001 Ch 5 caution): the
    # creator must never appear in this list. It is the SSO *role* ARN (aws-reserved path), not the assumed-role
    # session ARN that `aws sts get-caller-identity` prints. There is no region
    # segment in the path because Identity Center lives in us-east-1; only
    # non-us-east-1 instances get one. Verified with `aws iam list-roles
    # --path-prefix /aws-reserved/sso.amazonaws.com/` on 2026-08-10.
    - principalARN: arn:aws:iam::242626138899:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_StreamingDeploy_c76ab22657ecbba5
      accessPolicies:
        - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          accessScope:
            type: cluster

vpc:
  cidr: 10.42.0.0/16
  nat:
    # One NAT gateway: $32.85/mo instead of $98.55. An AZ failure costs all
    # private subnets their egress. See docs/aws/02-vpc-and-networking.md.
    gateway: Single
  clusterEndpoints:
    publicAccess: true    # kubectl from a laptop, no bastion
    privateAccess: true   # node -> API server traffic stays in the VPC
  publicAccessCIDRs:
    - 0.0.0.0/0           # Tighten to a static office/home /32 if you have one.

# Creates the cluster's OIDC provider. Pod Identity is the modern default and
# is used where it can be, but the AWS Load Balancer Controller and Karpenter
# still want IRSA -- which needs this.
iam:
  withOIDC: true

managedNodeGroups:
  - name: system
    instanceType: t3.medium
    amiFamily: AmazonLinux2023
    # 3, not 2: t3.medium is capped at 17 pods/node in the CNI's default
    # addressing mode (ENABLE_PREFIX_DELEGATION=false below), and the platform
    # layer alone (ArgoCD, monitoring, ESO, KEDA, Strimzi, LBC, Karpenter,
    # kube-system) fills two nodes' slots -- app pods sat Pending with
    # "Too many pods" (hit 2026-08-11). Raising density via prefix delegation
    # instead requires maxPodsPerNode + a nodegroup roll; a third node is the
    # simpler, cheaper-to-reason-about fix at this scale.
    # 4 (was 3, was 2 -- both hit 2026-08-11): the third node fixed the
    # 17-pod cap; the fourth exists because the Kafka broker requests 2Gi and
    # no t3.medium with platform pods aboard has 2Gi free ("Insufficient
    # memory"), while Karpenter's pools are transcode-tainted on purpose. A
    # fresh node (~3.4Gi allocatable) hosts the broker with headroom. If this
    # group ever needs a 5th node, stop and rethink instance size instead.
    desiredCapacity: 4
    minSize: 2
    maxSize: 4
    volumeSize: 40
    volumeType: gp3
    volumeEncrypted: true
    privateNetworking: true
    # Must be a subset of the cluster-level availabilityZones above.
    availabilityZones: [us-east-1a, us-east-1f]
    labels:
      workload: system
    tags:
      # No karpenter.sh/discovery tag here: an empty tag value is rejected by
      # CloudFormation's CreateStack API ("length greater than or equal to 1",
      # verified 2026-08-10), and it was pointless anyway -- Karpenter only
      # manages nodes it provisioned itself, so a managed nodegroup needs no
      # opt-out. Discovery tags go on subnets and the cluster security group.
      Project: streaming
    # Do NOT taint this group. Karpenter, CoreDNS, the load balancer
    # controller, External Secrets, Strimzi and every stateless app pod live
    # here; a taint means adding tolerations to every chart for no benefit at
    # this size.

cloudWatch:
  clusterLogging:
    # Control-plane logs. "authenticator" is the one that tells you why an
    # access entry did not work; "audit" is how you find out what actually
    # changed an object. Omitting "controllerManager" and "scheduler" keeps
    # the volume (and the bill) down.
    enableTypes: ["api", "audit", "authenticator"]
    # eksctl does not set retention on the log group by default -- without
    # this it is "Never expire" and grows forever at $0.03/GB/month.
    logRetentionInDays: 7

addons:
  # metrics-server: eksctl installs this implicitly during `create cluster`,
  # but our first run failed before reaching it -- and implicit behavior is
  # how this file bit us twice already. Declared explicitly so `eksctl create
  # addon -f` converges the cluster to this list, whole and exact.
  - name: metrics-server
    version: latest
  - name: vpc-cni
    version: latest
    configurationValues: |-
      {"env":{"ENABLE_PREFIX_DELEGATION":"false","WARM_ENI_TARGET":"1"}}
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: eks-pod-identity-agent
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
    podIdentityAssociations:
      - namespace: kube-system
        serviceAccountName: ebs-csi-controller-sa
        permissionPolicyARNs: ["arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"]
