[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# A deliberately small starting set for CI's first lint pass: real bugs
# (F), style (E/W), import order (I), outdated syntax (UP) -- not every
# opinionated category (pylint, bugbear, ...) ruff ships. Widen later if
# it earns its keep.
select = ["E", "F", "W", "I", "UP"]
