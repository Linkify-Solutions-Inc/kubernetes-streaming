<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Get a stream key</title>
</head>
<body>
  <p><a href="/">&larr; back</a></p>
  <h1>Get a stream key</h1>

  {% if result %}
    <p><strong>{{ result.display_name }}</strong> — save this, it's shown once:</p>
    <pre>stream key: {{ result.stream_key }}
RTMP URL:  rtmp://localhost:1935/{{ result.stream_key }}</pre>
  {% else %}
    <form method="post" action="/streamers/new">
      <label>Display name: <input type="text" name="display_name" required></label>
      <button type="submit">Create</button>
    </form>
  {% endif %}
</body>
</html>
