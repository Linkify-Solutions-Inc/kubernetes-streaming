name: streaming-project

services:
  # ── Infra ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/media &&
      mc anonymous set download local/media/hls
      "

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "29092:29092" # host access, e.g. kcat/kafdrop from the laptop
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    entrypoint: ["/bin/sh", "/init-topics.sh"]

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    depends_on:
      - ingest-webhook
    ports:
      - "1935:1935" # RTMP ingest (OBS points here)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml

  # ── App services (Phase 1 stubs — see SPEC.md) ──────────────────────
  ingest-webhook:
    # Built by CI, not locally -- see .github/workflows/ci.yml and SPEC.md's
    # CI/CD design. IMAGE_TAG defaults to "latest" so a manual
    # `docker compose up -d` still works without it set; the CD deploy job
    # sets it explicitly to the exact commit's sha-<short> tag.
    image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-ingest-webhook:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  upload-api:
    image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-upload-api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8001:8000"

  transcode-worker:
    image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-transcode-worker:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  analytics-worker:
    image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-analytics-worker:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-web:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      UPLOAD_API_URL: http://upload-api:8000
      # Browser-reachable MinIO address (internal docker DNS "minio:9000"
      # isn't reachable from outside the compose network) — see
      # dev_server_access memory for why this is the Tailscale MagicDNS name.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      # Same reasoning as MINIO_PUBLIC_URL, but for the RTMP address shown to
      # streamers: OBS runs on the streamer's own machine, so "localhost"
      # would point at their machine, not this server. Needs to be the
      # Tailscale MagicDNS hostname (or public host in prod), e.g.
      # rtmp://aayush-internserver.hs.aayushpathak.com:1935
      RTMP_PUBLIC_URL: ${RTMP_PUBLIC_URL}
    depends_on:
      - upload-api
    ports:
      - "8080:8000"

volumes:
  postgres-data:
  minio-data:
  kafka-data:
