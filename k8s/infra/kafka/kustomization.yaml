---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied in this order by kubectl. The Kafka CR will sit NotReady for a
# minute or two until the KafkaNodePool's pod is up; the KafkaTopics will sit
# NotReady until the Kafka CR is Ready. Both are expected, not an error.
resources:
  - namespace.yaml
  - nodepool-dual.yaml
  - kafka.yaml
  - kafka-metrics-configmap.yaml
  - topics.yaml
  - networkpolicy.yaml
  - consumer-group-bootstrap-job.yaml
  # PodMonitor needs the `monitoring` namespace (Module 16), created by
  # k8s/platform/kube-prometheus-stack.yaml in wave 0 -- ahead of this
  # Application's wave 20.
  - podmonitor-kafka.yaml
