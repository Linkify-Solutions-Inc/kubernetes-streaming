# Grafana admin credentials. The archived course set grafana.adminPassword by
# hand with `argocd app set`, but under app-of-apps with selfHeal the root app
# reverts that parameter on every sync -- the password would flap. Instead the
# chart reads an existingSecret (see k8s/platform/kube-prometheus-stack.yaml),
# and this ExternalSecret materializes it from Secrets Manager, same pattern
# as every other secret in this directory.
#
# The Secrets Manager entry is created once per environment:
#   aws secretsmanager create-secret --name streaming/grafana \
#     --secret-string '{"username":"admin","password":"<generate-one>"}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  # Explicit namespace wins over the Application's destination (streaming):
  # Grafana runs in monitoring and can only mount Secrets from its own
  # namespace. kube-prometheus-stack syncs in wave 0 with CreateNamespace, so
  # the namespace exists by the time this applies in wave 10.
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: streaming/grafana
        property: username
    - secretKey: admin-password
      remoteRef:
        key: streaming/grafana
        property: password
