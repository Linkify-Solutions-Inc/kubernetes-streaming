apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-config
  namespace: streaming
data:
  # Public endpoints (no-DNS build). These are printed in the UI and pasted
  # into OBS — they are not secrets, and putting them in a ConfigMap keeps
  # them diffable in git.
  # RTMP: the mediamtx NLB hostname replaces the DNS name (REBUILD-SENSITIVE —
  #   rediscover after the NLB provisions with:
  #     kubectl get svc mediamtx-rtmp -n streaming \
  #       -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
  RTMP_PUBLIC_URL: "rtmp://k8s-streamin-mediamtx-6921c7d33a-a52534440e9cad03.elb.us-east-1.amazonaws.com:1935"
  # HLS: played back straight from S3 — the bucket policy allows public reads
  # on hls/* only (raw/ uploads stay private). No CloudFront, no DNS.
  HLS_PUBLIC_BASE_URL: "https://linkify-streaming-media-242626138899.s3.us-east-1.amazonaws.com/hls"

  # In-cluster addresses.
  UPLOAD_API_URL: "http://upload-api.streaming.svc.cluster.local:8000"
  MEDIAMTX_RTMP_URL: "rtmp://mediamtx.streaming.svc.cluster.local:1935"
  # Cross-namespace, so the FQDN is required — the short name will not resolve.
  KAFKA_BOOTSTRAP_SERVERS: "streaming-kafka-bootstrap.kafka.svc.cluster.local:9092"

  # S3. No keys here: the pods authenticate with EKS Pod Identity.
  # Account ID suffix keeps the bucket name globally unique.
  S3_BUCKET: "linkify-streaming-media-242626138899"
  AWS_REGION: "us-east-1"
  S3_ADDRESSING_STYLE: "virtual"
