apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-config
  namespace: streaming
data:
  # Public endpoints. These are printed in the UI and pasted into OBS — they are
  # not secrets, and putting them in a ConfigMap keeps them diffable in git.
  RTMP_PUBLIC_URL: "rtmp://rtmp.k8s.linkifysolutions.com:1935"
  HLS_PUBLIC_BASE_URL: "https://cdn.k8s.linkifysolutions.com"

  # In-cluster addresses.
  UPLOAD_API_URL: "http://upload-api.streaming.svc.cluster.local:8000"
  MEDIAMTX_RTMP_URL: "rtmp://mediamtx.streaming.svc.cluster.local:1935"
  # Cross-namespace, so the FQDN is required — the short name will not resolve.
  KAFKA_BOOTSTRAP_SERVERS: "streaming-kafka-bootstrap.kafka.svc.cluster.local:9092"

  # S3. No keys here: the pods authenticate with EKS Pod Identity.
  # Replace <accountid> with the real AWS account ID.
  S3_BUCKET: "linkify-streaming-media-<accountid>"
  AWS_REGION: "us-east-1"
  S3_ADDRESSING_STYLE: "virtual"
