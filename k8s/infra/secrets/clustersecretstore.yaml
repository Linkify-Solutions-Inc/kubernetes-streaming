apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # There is deliberately NO `auth:` block. With EKS Pod Identity the AWS
      # SDK's default credential chain resolves through the Pod Identity agent
      # automatically.
      #
      # Do NOT add auth.jwt.serviceAccountRef: ESO cannot impersonate a
      # ServiceAccount whose IAM role is bound via Pod Identity, and doing so
      # produces "unable to assume role", which reads like an IAM trust-policy
      # problem but is a client-configuration problem.
