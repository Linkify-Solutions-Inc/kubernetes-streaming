apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streaming-mediamtx
  namespace: streaming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: streaming-mediamtx
    creationPolicy: Owner
  dataFrom:
    # {"apiUser": "...", "apiPassword": "..."} — credentials for MediaMTX's
    # control API, which Module 12 exposes on :9997 for the NLB health check.
    - extract:
        key: streaming/mediamtx
