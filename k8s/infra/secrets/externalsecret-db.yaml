apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streaming-db
  namespace: streaming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: streaming-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The derived value. docker-compose.yml composed this from
        # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB at deploy time; Kubernetes
        # Secrets have no interpolation, so ESO composes it here instead and the
        # app sees one literal.
        #
        # Only `.username` and `.password` come from the RDS-managed secret.
        # AWS documents that secret's ARN and status but NOT its JSON contents,
        # so do not assume it carries host/port/dbname -- see Module 8. The
        # endpoint, port and database name are stable, non-secret facts about
        # the instance, so they are substituted from the ConfigMap below at
        # apply time instead of being read out of the secret. Password rotation
        # still flows through automatically, which is the whole point.
        #
        # `| urlquery` is load-bearing: RDS-generated passwords are 28 chars
        # including punctuation, and an unescaped '@' or '/' silently reshapes
        # the URL into something psycopg reports as a confusing hostname error.
        POSTGRES_DSN: >-
          postgresql://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require
        # Individual fields for the db-migrate Job's PG* environment variables.
        host: "{{ .host }}"
        port: "{{ .port }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        dbname: "{{ .dbname }}"
  dataFrom:
    # The RDS-managed master credential secret: username + password.
    # Substitute the real name -- it is generated, not chosen:
    #   aws rds describe-db-instances --db-instance-identifier streaming-db \
    #     --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text
    - extract:
        key: rds!db-REPLACE-ME
    # Endpoint facts, not secrets. Created in Module 8 as a plain Secrets
    # Manager entry alongside the instance so the template above has a single
    # uniform source. Contents:
    #   {"host": "<rds-endpoint>", "port": "5432", "dbname": "streaming"}
    - extract:
        key: streaming/db-endpoint
