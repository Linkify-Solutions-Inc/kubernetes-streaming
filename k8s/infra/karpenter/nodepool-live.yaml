apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: transcode-live
spec:
  template:
    metadata:
      labels:
        workload: transcode
        transcode-mode: live
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: transcode
      # Only pods that explicitly tolerate this land here. Nothing else in the
      # cluster can accidentally consume a compute-optimized node.
      taints:
        - key: workload
          value: transcode
          effect: NoSchedule
      requirements:
        # Deliberate: a spot interruption mid-live-stream is viewer-visible and
        # unrecoverable without the streamer restarting OBS. See
        # docs/aws/06-karpenter.md.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"] # c for GHz-per-dollar, m as fallback capacity
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"] # CI publishes amd64 images only
      # Recycle nodes daily so AMI patches land without manual work. A pod
      # annotated karpenter.sh/do-not-disrupt blocks this until it finishes.
      expireAfter: 24h
      terminationGracePeriod: 30m
  limits:
    cpu: "32" # hard ceiling, roughly 12 concurrent live streams
  disruption:
    # NEVER repack a running live transcode onto a cheaper node — that is a
    # self-inflicted interruption. WhenEmpty removes a node only once every
    # non-DaemonSet pod on it is gone. Scale-to-zero still works.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 2m
