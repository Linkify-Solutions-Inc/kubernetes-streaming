# TEMPORARY SHAPE. Module 14 deletes this Deployment and replaces it with
# two KEDA ScaledJobs (one live, one VOD) that create one Job per unit of
# work. Until then transcode-worker is exactly what it is under Docker
# Compose: one long-running process with a `while True` Kafka consumer loop
# handling every stream and every upload for the container's lifetime.
#
# Two consequences you live with for Modules 11-13:
#   - replicas MUST stay 1. The live-stream dedup guard (`active_streams`)
#     is in-process memory, so a second replica would happily start a second
#     ffmpeg for the same stream.
#   - every rollout kills every in-flight transcode. That is the single
#     biggest reason Module 14 exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transcode-worker
  template:
    metadata:
      labels:
        app: transcode-worker
      annotations:
        # Karpenter would otherwise consolidate this node out from under a
        # running encode to save a few cents an hour.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: transcode-worker
      # ffmpeg gets SIGTERM, finalizes the playlist, exits. 5 minutes is
      # enough for that; it is not enough to finish a broadcast, and it is
      # not meant to be.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transcode-worker
          image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-transcode-worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: streaming-db
                  key: POSTGRES_DSN
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MEDIAMTX_RTMP_URL
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: MEDIAMTX_RTMP_URL
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: S3_BUCKET
            - name: S3_ADDRESSING_STYLE
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: S3_ADDRESSING_STYLE
            # tempfile.mkdtemp() honours TMPDIR. Without this, HLS segments
            # are written to the container's read-only root and every
            # transcode fails at the first segment.
            - name: TMPDIR
              value: /scratch
          # No probes. There is no HTTP server in this process today, and an
          # exec probe on a busy encoder buys nothing. Module 14 makes this
          # moot: a Job either completes or it does not.
          resources:
            requests:
              # ~2.3 cores / ~1 GiB per concurrent live transcode, measured
              # on the bare-metal box against a 1080p source.
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 20Gi
            limits:
              # No CPU limit on purpose: CFS throttling a real-time encoder
              # makes it fall behind the source, which is indistinguishable
              # from "the stream froze".
              memory: 4Gi
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        # HLS segments are written here before the uploader thread ships
        # them to S3. Size this against the live sliding window (30 x 4s
        # segments x 3 renditions) plus one full VOD source file.
        - name: scratch
          emptyDir:
            sizeLimit: 40Gi
