---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streaming

resources:
  - job.yaml

configMapGenerator:
  # The SQL lives in postgres/migrations/ — one copy, in git, shared with the
  # docker-compose path. Kustomize reads it from there rather than us keeping a
  # duplicate under k8s/.
  #
  # IMPORTANT: reaching outside the kustomization root requires
  #   --load-restrictor LoadRestrictionsNone
  # Without it you get:
  #   security; file '.../postgres/migrations/001_baseline.sql' is not in or
  #   below '.../k8s/apps/base/db-migrate'
  # See docs/aws/08-rds-postgres.md ("What breaks", #1) for the two ways to
  # deal with that, including the ArgoCD setting in Module 15.
  - name: db-migrations
    files:
      - ../../../../postgres/migrations/001_baseline.sql
    options:
      # New SQL file -> new ConfigMap hash -> the Job's pod template changes,
      # which is what makes ArgoCD notice there is something to apply.
      disableNameSuffixHash: false
