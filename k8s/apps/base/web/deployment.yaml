apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-web
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: UPLOAD_API_URL
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: UPLOAD_API_URL
            # HLS_PUBLIC_BASE_URL and RTMP_PUBLIC_URL are deliberately NOT in
            # base/config.env -- they are the two values that differ between
            # the kubeadm box and EKS, so each overlay supplies its own. A
            # missing key here is CreateContainerConfigError naming the key,
            # not a crash-loop.
            - name: HLS_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: HLS_PUBLIC_BASE_URL
            - name: RTMP_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: RTMP_PUBLIC_URL
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness is /livez, not a check on upload-api. web calls
          # upload-api on every page render, but making web NotReady when
          # upload-api is down turns one outage into two.
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: true, and uvicorn/Jinja2 want a writable
        # /tmp. sizeLimit is what stops a runaway upload spool from filling
        # the node's disk and triggering DiskPressure evictions on pods that
        # have nothing to do with this one.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
