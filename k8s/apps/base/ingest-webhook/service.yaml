apiVersion: v1
kind: Service
metadata:
  name: ingest-webhook
spec:
  # The name and the port are load-bearing. mediamtx.yml addresses this as
  # http://ingest-webhook.streaming.svc.cluster.local:8000 -- rename either
  # and every publish is rejected at the auth hook with no obvious cause.
  type: ClusterIP
  selector:
    app: ingest-webhook
  ports:
    - name: http
      port: 8000
      targetPort: http
