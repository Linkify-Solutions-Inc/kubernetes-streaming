apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-webhook
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ingest-webhook
  template:
    metadata:
      labels:
        app: ingest-webhook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ingest-webhook
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ingest-webhook
      containers:
        - name: ingest-webhook
          image: ghcr.io/linkify-solutions-inc/kubernetes-streaming-ingest-webhook
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: streaming-db
                  key: POSTGRES_DSN
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            # main.py require()s exactly three vars; this one was never wired
            # and the pod exited at import time (hit 2026-08-11).
            - name: MAX_CONCURRENT_LIVE_STREAMS
              valueFrom:
                configMapKeyRef:
                  name: streaming-config
                  key: MAX_CONCURRENT_LIVE_STREAMS
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Deliberately trivial, not a dependency check. MediaMTX's
          # authHTTPAddress is a hard gate: zero Ready ingest-webhook pods
          # means nobody on the platform can go live. A DB-dependent
          # readiness check turns a 30-second RDS blip into a total ingest
          # outage, when a 500 from the handler would have been the honest
          # per-request signal.
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
