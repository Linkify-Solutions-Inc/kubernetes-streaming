apiVersion: v1
kind: Namespace
metadata:
  name: streaming
  labels:
    # Pod Security Admission. "restricted" is what the securityContext
    # blocks in every Deployment here are already written against: non-root,
    # no privilege escalation, all capabilities dropped, RuntimeDefault
    # seccomp. `warn` and `audit` are set too so a violating pod tells you at
    # apply time instead of at scheduling time.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
