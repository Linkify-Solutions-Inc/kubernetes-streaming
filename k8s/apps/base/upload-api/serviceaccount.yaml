apiVersion: v1
kind: ServiceAccount
metadata:
  name: upload-api
# No annotations. EKS Pod Identity binds the IAM role to
# (cluster, namespace, service account) on the AWS side, not with an
# annotation here -- that is the IRSA style. Module 7 creates the
# association. The name below is half of that tuple: rename this
# ServiceAccount and the pod silently falls back to the node role.
