apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming
  annotations:
    # LAST wave on purpose (ScaledJobs are wave 1). No-DNS build: the ingress
    # is HTTP-only with no ACM cert, so nothing external gates its health —
    # the wave now just orders the ALB after the app's scaled jobs settle, so
    # its provisioning never holds a sync operation open.
    argocd.argoproj.io/sync-wave: "2"
    alb.ingress.kubernetes.io/scheme: internet-facing
    # NLB/ALB -> pod IP directly. With the VPC CNI handing pods real VPC
    # addresses this is free and strictly better than `instance` mode, which
    # lands on a NodePort and gets kube-proxy DNAT'd, possibly to a pod on a
    # different node, adding a cross-AZ hop and its data charge.
    alb.ingress.kubernetes.io/target-type: ip

    # Without group.name, EVERY Ingress object provisions its own ALB at
    # ~$16/month. With it, they share one. It is not retrofittable without a
    # DNS change, so set it now even with a single Ingress.
    alb.ingress.kubernetes.io/group.name: streaming

    # HTTP-only, no DNS/cert. The ALB is reached at its auto-assigned
    # *.elb.amazonaws.com hostname (or the public IP) on port 80.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

    alb.ingress.kubernetes.io/healthcheck-path: /livez
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # 1800s idle timeout for the upload path. Necessary but NOT sufficient:
    # web's own httpx timeout is a *total* timeout and fires first. See
    # docs/aws/12-ingress-and-rtmp.md.
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=1800,
      routing.http2.enabled=true
    alb.ingress.kubernetes.io/target-group-attributes: >-
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false
spec:
  ingressClassName: alb
  rules:
    # No host rule: with DNS unset, the ALB accepts any Host header. Ingresses
    # on the shared group.name ALB are routed by host in the DNS build; without
    # hosts they'd split by path — keep the single `web` rule at /.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000

# ONLY `web` IS IN HERE, and that is a security boundary, not an oversight.
#
#   upload-api      -- POST /streamers mints stream keys with no auth. web
#                      proxies to it server-side over ClusterIP.
#   ingest-webhook  -- called only by MediaMTX, inside the cluster.
#                      /hooks/auth would let anyone on the internet probe
#                      stream keys; /hooks/publish would let them forge
#                      stream-start events and spend your transcode budget.
#   analytics-worker -- no HTTP surface at all.
#
# If you need to reach one of them, `kubectl port-forward`. Do not add a
# path rule "just for debugging" -- group.name means it lands on the same
# public ALB.
