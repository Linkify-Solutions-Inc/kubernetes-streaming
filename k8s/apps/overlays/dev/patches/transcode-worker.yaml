apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
spec:
  template:
    spec:
      containers:
        - name: transcode-worker
          env:
            - name: S3_ENDPOINT
              value: http://minio.streaming.svc.cluster.local:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: streaming-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: streaming-secrets
                  key: MINIO_ROOT_PASSWORD
