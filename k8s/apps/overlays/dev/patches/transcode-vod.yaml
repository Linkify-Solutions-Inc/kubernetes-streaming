# See transcode-live.yaml's header -- same reasoning, VOD's ScaledJob.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: transcode-vod
  namespace: streaming
spec:
  jobTargetRef:
    template:
      spec:
        # Same reasoning as transcode-live.yaml.
        nodeSelector: null
        tolerations: null
        containers:
          - name: transcode
            env:
              - name: TRANSCODE_MODE
                value: "vod"
              - name: TRANSCODE_CONSUMER_GROUP
                value: "transcode-vod"
              - name: TRANSCODE_TRIGGER_TOPIC
                value: "upload.events"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POSTGRES_DSN
                valueFrom:
                  secretKeyRef:
                    name: streaming-db
                    key: POSTGRES_DSN
              - name: KAFKA_BOOTSTRAP_SERVERS
                valueFrom:
                  configMapKeyRef:
                    name: streaming-config
                    key: KAFKA_BOOTSTRAP_SERVERS
              - name: S3_BUCKET
                valueFrom:
                  configMapKeyRef:
                    name: streaming-config
                    key: S3_BUCKET
              - name: S3_ADDRESSING_STYLE
                valueFrom:
                  configMapKeyRef:
                    name: streaming-config
                    key: S3_ADDRESSING_STYLE
              - name: TMPDIR
                value: /scratch
              - name: S3_ENDPOINT
                value: http://minio.streaming.svc.cluster.local:9000
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: streaming-secrets
                    key: MINIO_ROOT_USER
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: streaming-secrets
                    key: MINIO_ROOT_PASSWORD
