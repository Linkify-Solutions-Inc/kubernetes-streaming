# MediaMTX config, Kubernetes edition.
#
# This is the same file as mediamtx/mediamtx.yml at the repo root, with the
# hook URLs written as fully-qualified Kubernetes DNS names and the HTTP API
# enabled. It is mounted from a ConfigMap generated by
# k8s/apps/base/kustomization.yaml, NOT bind-mounted like it was under
# Docker Compose.
#
# Do not `kubectl edit` the generated ConfigMap on a running cluster.
# MediaMTX watches its own config file and reloads on change -- which
# restarts the RTMP listener and drops every live stream, with no rollout
# and no event to explain it. Change this file, let the generator's name
# hash roll the pod, and do it in a quiet window.

rtmpAddress: :1935

# ---------------------------------------------------------------------------
# DO NOT TOUCH. This value is the fix for a real, reproduced production
# stall, not a tuning preference.
#
# The default writeQueueSize (512 outgoing packets) is what caused
# "reader is too slow, discarding N frames" -> "closed: i/o timeout" against
# transcode-worker's ffmpeg client, on a box with CPU and network headroom to
# spare (ffmpeg at ~230% of 12 available cores during the stall). A brief
# scheduling or IO hiccup on the reader side is enough to overflow a
# 512-packet queue. See bluenviron/mediamtx#5162 and #5093, and the SPEC.md
# note on the same symptom. The RAM cost is negligible at this scale.
#
# On EKS this matters MORE than it did on the single box: ffmpeg and MediaMTX
# now sit on different nodes with a real network between them.
# ---------------------------------------------------------------------------
writeQueueSize: 65536

# Enabled for Kubernetes. Two reasons:
#   1. It gives the NLB an HTTP health check target that only returns 200 once
#      MediaMTX is genuinely up. A bare TCP connect on :1935 passes the
#      instant the socket is listening and keeps passing when MediaMTX is
#      wedged, which is exactly the failure you want the health check to see.
#   2. `kubectl exec deploy/mediamtx -- wget -qO- localhost:9997/v3/paths/list`
#      is the fastest way to answer "is this stream actually arriving".
api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

# Real stream-key auth: MediaMTX calls this URL with a JSON POST before
# accepting a publish (fields confirmed against MediaMTX's own source:
# ip/user/password/token/action/path/protocol/id/query/userAgent). 2xx
# accepts, anything else rejects. This is the actual gate -- runOnReady
# below only fires *after* a stream is already accepted.
#
# The Compose value was http://ingest-webhook:8000/hooks/auth. That short
# name happens to ALSO be valid Kubernetes DNS -- a same-namespace Service
# name resolves through the pod's `search streaming.svc.cluster.local ...`
# list -- so it would have worked unchanged. The FQDN is written out anyway:
# the short name working is a coincidence, not a design, it breaks the moment
# anyone moves MediaMTX to another namespace, and with ndots:5 each short
# name costs four failed DNS lookups against CoreDNS before the right one.
authMethod: http
authHTTPAddress: http://ingest-webhook.streaming.svc.cluster.local:8000/hooks/auth

# No shell in the plain mediamtx image -- this config only works with the
# bluenviron/mediamtx:*-ffmpeg tag, which is Alpine-based and has wget/sh.
#
# Note: MediaMTX's hook is called runOnReady/runOnNotReady (fires when a
# stream becomes readable, i.e. right after publish, and when it stops being
# readable) -- there is no runOnPublish/runOnUnpublish field, despite that
# being a common assumption from other RTMP servers' naming.
paths:
  all_others:
    runOnReady: >
      wget -q -O /dev/null
      --post-data="path=$MTX_PATH"
      http://ingest-webhook.streaming.svc.cluster.local:8000/hooks/publish
    runOnNotReady: >
      wget -q -O /dev/null
      --post-data="path=$MTX_PATH"
      http://ingest-webhook.streaming.svc.cluster.local:8000/hooks/unpublish
