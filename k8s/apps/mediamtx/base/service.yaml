apiVersion: v1
kind: Service
metadata:
  name: mediamtx
spec:
  # In-cluster only. This is what transcode-worker dials
  # (MEDIAMTX_RTMP_URL), and what you port-forward to when debugging.
  # Public RTMP ingest is a separate Service in overlays/prod --
  # a type: LoadBalancer NLB, see docs/aws/12-ingress-and-rtmp.md.
  type: ClusterIP
  selector:
    app: mediamtx
  ports:
    - name: rtmp
      port: 1935
      targetPort: rtmp
    - name: api
      port: 9997
      targetPort: api
    - name: metrics
      port: 9998
      targetPort: metrics
