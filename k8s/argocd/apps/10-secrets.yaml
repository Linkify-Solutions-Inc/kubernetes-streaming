# Wave 10 — the ClusterSecretStore and the ExternalSecrets. Needs ESO's CRDs
# from wave 0.
#
# What is NOT in git, ever: a `Secret`. Not even an empty placeholder. The
# moment a Secret is committed, Argo tracks it, ESO overwrites its data, Argo
# calls that drift, and with selfHeal: true the two controllers fight in a loop
# that flaps the Secret and restarts every pod mounting it.
#
# With ESO's creationPolicy: Owner, the generated Secret carries an
# ownerReference to the ExternalSecret and no Argo tracking label, so Argo sees
# it as untracked-and-not-desired: not drift, and not pruned.
#
# See docs/aws/15-argocd-gitops.md and docs/aws/07-secrets.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Linkify-Solutions-Inc/kubernetes-streaming.git
    targetRevision: master
    path: k8s/infra/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# An ExternalSecret's .status block is rewritten on every refresh
# (refreshInterval: 1h), which Argo can read as perpetual drift. Ignore it.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
