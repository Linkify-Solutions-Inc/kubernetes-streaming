# Prometheus operator + Prometheus + Alertmanager + Grafana + node-exporter +
# kube-state-metrics, pre-wired. Sync-wave 0: its ServiceMonitor/PodMonitor
# CRDs and the `monitoring` namespace must exist before
# k8s/infra/kafka/podmonitor-kafka.yaml is synced in wave 20.
#
# Installed as an Argo Application wrapping the upstream Helm chart. Module
# 16's own walkthrough installs this by hand first (`helm upgrade --install`)
# to get Grafana running sooner; once this Application exists, Argo adopts
# that release rather than reinstalling it. See
# docs/aws/16-monitoring-cost-teardown.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0 # re-pinned from `helm search repo prometheus-community/kube-prometheus-stack` 2026-08-10
    helm:
      values: |
        grafana:
          # Credentials come from the grafana-admin Secret, materialized by
          # k8s/infra/secrets/externalsecret-grafana.yaml from Secrets Manager
          # (streaming/grafana). No password in git, and unlike the archived
          # `argocd app set` approach, nothing for the root app's selfHeal to
          # revert. Grafana may restart once or twice at first install until
          # wave 10 delivers the Secret -- that's the retry loop working.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
        prometheus:
          prometheusSpec:
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  resources:
                    requests:
                      storage: 20Gi
            # Without these two, the chart only scrapes ServiceMonitors and
            # PodMonitors carrying its own release label -- every one you
            # write yourself, and every one Strimzi/KEDA generate, gets
            # silently ignored. The single most common "I installed
            # Prometheus and it scrapes nothing" cause.
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
        # No receivers configured and nobody on call -- an Alertmanager with
        # nothing to route to just burns memory. Turning it on later is one
        # flag.
        alertmanager:
          enabled: false
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
