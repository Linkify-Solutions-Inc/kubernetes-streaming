# External Secrets Operator -- syncs AWS Secrets Manager values into
# Kubernetes Secrets. Sync-wave 0: its CRDs (ExternalSecret,
# ClusterSecretStore) must exist before k8s/infra/secrets/ is synced in
# wave 10, or Argo's dry-run fails with `no matches for kind "ExternalSecret"`.
#
# Installed as an Argo Application wrapping the upstream Helm chart, not by
# `helm install`. Pod Identity (not IRSA) is what gives the controller its
# AWS permissions -- `aws eks create-pod-identity-association` targets the
# `external-secrets` ServiceAccount the chart creates, so no
# serviceAccount.create=false override is needed here (contrast with
# aws-load-balancer-controller.yaml and karpenter.yaml, which reuse an
# eksctl-created IRSA ServiceAccount and must not let Helm replace it).
#
# See docs/aws/07-secrets.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # CONFIRM before first apply: run
    #   helm repo add external-secrets https://charts.external-secrets.io
    #   helm search repo external-secrets/external-secrets --versions | head -3
    # and pin whatever that reports -- the course deliberately doesn't fix a
    # version here, since ESO ships new charts often enough that a number
    # written today would already be behind by the time you read this.
    targetRevision: "<eso-chart-version>"
    helm:
      values: |
        installCRDs: true
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs carry large validation schemas that blow the 262144-byte
      # last-applied-configuration annotation limit under client-side apply.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
