name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  # GITHUB_TOKEN needs this to push images to ghcr.io from the build job --
  # some orgs default new repos to read-only Actions permissions, so this is
  # declared explicitly rather than relying on that default.
  packages: write

env:
  PYTHON_VERSION: "3.12" # matches every service Dockerfile's base image

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics-worker, ingest-webhook, transcode-worker, upload-api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only the 3 services with a test_main.py today (see SPEC.md's
        # "small starting test set") -- analytics-worker/upload-api don't
        # have one yet.
        service: [transcode-worker, ingest-webhook, web]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
        env:
          # Dummy values so each service's module-level os.environ[...]
          # reads succeed at import time -- none of these tests touch a
          # real Kafka/Postgres/network (Kafka's Producer() constructor
          # doesn't connect eagerly; DB calls are mocked in the tests that
          # need them). Harmless to set all of them for every service.
          KAFKA_BOOTSTRAP_SERVERS: test:9092
          POSTGRES_DSN: postgresql://test
          UPLOAD_API_URL: http://upload-api.test
          MINIO_PUBLIC_URL: http://minio.test
          RTMP_PUBLIC_URL: rtmp://rtmp.test
          MAX_CONCURRENT_LIVE_STREAMS: "8"

  changes:
    runs-on: ubuntu-latest
    needs: [lint, hadolint, test]
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter needs history to diff against
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            analytics-worker:
              - 'services/analytics-worker/**'
            ingest-webhook:
              - 'services/ingest-webhook/**'
            transcode-worker:
              - 'services/transcode-worker/**'
            upload-api:
              - 'services/upload-api/**'
            web:
              - 'services/web/**'

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Matrix built dynamically from paths-filter's output -- only the
      # services that actually changed get built, so one service's change
      # doesn't force a rebuild of all five (see SPEC.md).
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (ghcr.io requires lowercase) and short SHA
        run: |
          echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHA_SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        # Only needed when we're actually pushing (push to master) -- a PR
        # build still runs to validate the Dockerfile builds, just without
        # publishing anything.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}-${{ matrix.service }}:sha-${{ env.SHA_SHORT }}
            ghcr.io/${{ env.REPO_LC }}-${{ matrix.service }}:latest

  # GitOps CD (see docs/aws/15-argocd-gitops.md): CI never touches the
  # cluster, never holds a kubeconfig, and needs no network path into the
  # VPC. It writes the new image tag into the prod overlay and pushes; Argo
  # notices the commit and syncs it. This replaced a `deploy` job that ran
  # `docker compose pull/up` on a self-hosted runner installed on the old
  # dev box -- that runner and box are out of the deploy path entirely now.
  bump-manifests:
    needs: [changes, build]
    if: needs.changes.outputs.services != '[]' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest # no longer self-hosted; the dev box is out of the loop
    permissions:
      contents: write # to push the manifest commit
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 /usr/local/bin

      - name: Set image tags in the prod overlay
        run: |
          set -eu
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          cd k8s/apps/overlays/prod
          for svc in $(echo '${{ needs.changes.outputs.services }}' | jq -r '.[]'); do
            IMG="ghcr.io/${REPO_LC}-${svc}"
            kustomize edit set image "${IMG}=${IMG}:sha-${SHA_SHORT}"
          done

      - name: Commit and push
        run: |
          # Pushed with the default GITHUB_TOKEN, not a PAT -- commits made
          # with GITHUB_TOKEN do NOT retrigger workflow runs, which is what
          # keeps this from looping forever on its own push. Swapping in a
          # PAT here re-enables the loop.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/overlays/prod/kustomization.yaml
          git diff --staged --quiet || git commit -m "deploy: sha-$(git rev-parse --short=7 HEAD)"
          git push

  # Runs on every PR -- catches the class of problem that otherwise only
  # shows up as a failed ArgoCD sync (see docs/aws/15-argocd-gitops.md).
  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize, kubeconform and yq
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 /usr/local/bin
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - run: kustomize build k8s/apps/overlays/prod > /tmp/prod.yaml
      - run: kustomize build k8s/apps/mediamtx/overlays/aws > /tmp/mediamtx.yaml
      # The db-migrate root reads SQL from postgres/migrations/, outside its own
      # tree, so it needs the same relaxed restrictor ArgoCD is given (Module 15).
      - run: kustomize build --load-restrictor LoadRestrictionsNone k8s/apps/base/db-migrate > /tmp/migrate.yaml
      - run: |
          kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/prod.yaml /tmp/mediamtx.yaml /tmp/migrate.yaml
      - run: scripts/check_ceiling_sync.sh /tmp/prod.yaml # Module 14
